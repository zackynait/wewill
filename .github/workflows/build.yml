name: Build and Push to Docker Hub

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build Django
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: zaiser98/wewill-django:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build FastAPI
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          push: true
          tags: zaiser98/wewill-fastapi:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build Next.js
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: zaiser98/wewill-nextjs:latest
          cache-from: type=gha
          cache-to: type=gha,mode-max
      
      - name: Build Celery Worker
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: zaiser98/wewill-celery-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode-max
      
      - name: Build Celery Beat
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: zaiser98/wewill-celery-beat:latest
          cache-from: type=gha
          cache-to: type=gha,mode-max
      
      - name: Build Daphne
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: zaiser98/wewill-daphne:latest
          cache-from: type=gha
          cache-to: type=gha,mode-max
